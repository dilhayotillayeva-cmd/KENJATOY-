services:
  - type: web
    name: kenjatoy-ai
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    healthCheckPath: /health
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: CHAT_MODEL
        value: gpt-4.1-mini
      - key: IMAGE_MODEL
        value: gpt-image-1
